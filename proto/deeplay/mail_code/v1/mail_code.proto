syntax = "proto3";

/**
 * Пакет сервиса. v1 в имени: если формат когда-нибудь поменяется несовместимо,
 * рядом заведём v2, а v1 ломать не будем.
 */
package deeplay.mail_code.v1;

/**
 * Общие правила proto3 для этого файла:
 * - незаполненное поле приходит со значением по умолчанию: пустая строка,
 *   0 у чисел, нулевой элемент у энамов. «Не передали» и «передали 0» не
 *   различить, поэтому у каждого поля ниже написано, что значат 0 или пусто;
 * - по гугловому стайл-гайду нулевой элемент энама называется UNSPECIFIED, и
 *   если он пришёл, это ошибка, если явно не сказано иное;
 * - время везде в миллисекундах от 1970-01-01 00:00:00 UTC (unix time в мс),
 *   без часовых поясов.
 */

/**
 * Сервис читает почтовые ящики и отдаёт коды подтверждения из писем GGPass.
 * Клиент сервиса — пилот регистрации (наш сервис, который регистрирует
 * аккаунты GGPass): он просит GGPass отправить код на почту и сразу идёт сюда
 * за этим кодом.
 */
service MailCodeService {
  /**
   * Ищет на ящике email письмо нужного вида (kind), пришедшее позже
   * sent_after_unix_ms, и отдаёт из него код. Если такого письма ещё нет,
   * держит запрос открытым до wait_seconds секунд и отвечает сразу, как только
   * письмо придёт.
   * Если подходящих писем несколько, отдаёт код из самого нового.
   * Вызов только читает: письмо не удаляется и не помечается прочитанным.
   * Повторный такой же запрос вернёт тот же код, это нужно, если ответ
   * потерялся по сети.
   * Все исходы (нашли, не дождались, нет ящика) возвращаются в поле result при
   * статусе gRPC OK. Статус не OK — только если сервис вообще не смог
   * обработать запрос. Если клиент отменил вызов (истёк его дедлайн), сервис
   * перестаёт ждать.
   */
  rpc GetCode(GetCodeRequest) returns (GetCodeResponse);
}

/**
 * Запрос кода из письма.
 */
message GetCodeRequest {
  /**
   * Полный адрес ящика, куда GGPass отправил письмо, например
   * "user@example.com". Сравнивать без учёта регистра.
   * Обязательное: если пусто, ответ GET_CODE_RESULT_FAIL.
   */
  string email = 1;

  /**
   * Какой код нужен: регистрации или 2FA (см. CodeKind). Чтобы не отдать код
   * из письма другого вида, если в ящике лежат оба.
   * Обязательное: при CODE_KIND_UNSPECIFIED ответ GET_CODE_RESULT_FAIL.
   */
  CodeKind kind = 2;

  /**
   * Брать только письма, пришедшие в ящик позже этого момента. Миллисекунды
   * UTC от 1970-01-01, например 1793620800000 = 2026-11-02 12:00:00 UTC.
   * Пилот ставит сюда время прямо перед тем, как попросить GGPass отправить
   * код, с запасом в несколько секунд назад. Без этого при повторной отправке
   * сервис может отдать код из старого письма, которое ещё лежит в ящике.
   * Сравнивать со временем прихода письма на почтовый сервер (в IMAP это
   * INTERNALDATE), а не с заголовком Date: его ставит отправитель.
   * 0 — без фильтра по времени, отдать код из самого нового письма.
   */
  int64 sent_after_unix_ms = 3;

  /**
   * Сколько секунд максимум ждать письмо, если его ещё нет. Пилот передаёт
   * около 60 и ставит дедлайн вызова на несколько секунд больше.
   * 0 — не ждать: один раз проверить ящик и сразу ответить.
   * Слишком большое значение сервис может урезать до своего предела.
   */
  int32 wait_seconds = 4;

  /**
   * Id сессии пилота. Только для логов, чтобы найти один и тот же запрос у
   * обеих сторон. Необязательное, может быть пустым.
   */
  string session_id = 5;
}

/**
 * Вид письма с кодом.
 */
enum CodeKind {
  /**
   * Не задан. Клиент такое не шлёт, на него сервис отвечает
   * GET_CODE_RESULT_FAIL.
   */
  CODE_KIND_UNSPECIFIED = 0;

  /**
   * Код подтверждения почты при регистрации нового аккаунта GGPass.
   */
  CODE_KIND_SIGN_UP = 1;

  /**
   * Код двухфакторной защиты (2FA) GGPass: приходит при входе в аккаунт с
   * включённой 2FA и при включении или выключении 2FA в настройках аккаунта.
   */
  CODE_KIND_MFA = 2;
}

/**
 * Ответ на запрос кода.
 */
message GetCodeResponse {
  /**
   * Итог запроса, см. GetCodeResult. Поля code, received_at_unix_ms и subject
   * заполнены только при GET_CODE_RESULT_SUCCESS.
   */
  GetCodeResult result = 1;

  /**
   * Код из письма как есть, например "048213". Строка, а не число: в числе
   * пропал бы ведущий ноль. Только при SUCCESS, иначе пустой.
   */
  string code = 2;

  /**
   * Когда письмо пришло в ящик, по часам почтового сервера. Миллисекунды UTC
   * от 1970-01-01. Только при SUCCESS, иначе 0. Для логов: видно, сколько
   * письмо шло.
   */
  int64 received_at_unix_ms = 3;

  /**
   * Тема письма как есть. Только при SUCCESS, иначе пустая. Для логов и
   * разборов: если GGPass поменяет шаблон письма, по теме видно, что пришло.
   */
  string subject = 4;

  /**
   * Понятное человеку описание причины при UNKNOWN_MAILBOX и FAIL. Идёт в
   * логи пилота. При SUCCESS и NOT_FOUND пустое.
   */
  string error_message = 5;
}

/**
 * Итог запроса кода.
 */
enum GetCodeResult {
  /**
   * Не задан. Сервис так не отвечает, клиент считает это ошибкой.
   */
  GET_CODE_RESULT_UNSPECIFIED = 0;

  /**
   * Письмо нашлось, код в поле code.
   */
  GET_CODE_RESULT_SUCCESS = 1;

  /**
   * За wait_seconds подходящее письмо не пришло. Это не сбой сервиса: пилот
   * покажет «код не пришёл» и может попросить GGPass отправить код ещё раз.
   */
  GET_CODE_RESULT_NOT_FOUND = 2;

  /**
   * Такого ящика у сервиса нет: чужой домен или ящик не заведён. Повторять
   * запрос бессмысленно.
   */
  GET_CODE_RESULT_UNKNOWN_MAILBOX = 3;

  /**
   * Любая другая ошибка: почтовый сервер недоступен, письмо не разобрали, в
   * запросе пустые обязательные поля. Причина в error_message, клиент может
   * повторить запрос.
   */
  GET_CODE_RESULT_FAIL = 4;
}
