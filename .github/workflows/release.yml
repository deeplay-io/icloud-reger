# Релиз по тегу: npm version minor && git push --follow-tags
# Собирает Windows-установщик, проверяет его и выкладывает в Releases, откуда его забирает автообновление.
# Вручную: Actions → release → Run workflow, в «Use workflow from» выбрать тег.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Тег совпадает с версией в package.json
        run: |
          want="v$(node -p "require('./package.json').version")"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "::error::Запуск с $GITHUB_REF_NAME, а версия в package.json — $want: запускайте с тега $want"; exit 1; }

      # Прямые ссылки github.com/…/releases/download то и дело отвечают 504, а через API GitHub те же файлы
      # отдаются. Electron, готовые сборки better-sqlite3 и NSIS качаем через API и раздаём с 127.0.0.1:8099
      # (.github/serve-binaries.js); контрольные суммы сверяют сами electron, prebuild-install и electron-builder.
      # Версии NSIS — те, что запрашивает electron-builder 24.13; после его обновления сборка упадёт с 404 на новом имени.
      - name: Файлы с GitHub через API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/gh-bin"
          mkdir -p "$dir"
          locked() { node -p "require('./package-lock.json').packages['node_modules/$1'].version"; }
          electron=$(locked electron)
          sqlite=$(locked better-sqlite3)
          gh release download "v$electron" --repo electron/electron --pattern "electron-v$electron-win32-x64.zip" --dir "$dir"
          gh release download "v$sqlite" --repo WiseLibs/better-sqlite3 --pattern "better-sqlite3-v$sqlite-*-win32-x64.tar.gz" --dir "$dir"
          for name in nsis-3.0.4.1 nsis-resources-3.4.1; do
            gh release download "$name" --repo electron-userland/electron-builder-binaries --pattern "$name.7z" --dir "$dir"
          done
          ls "$dir"
          {
            echo "BINARIES_DIR=$dir"
            echo "ELECTRON_MIRROR=http://127.0.0.1:8099/"
            echo "npm_config_better_sqlite3_binary_host=http://127.0.0.1:8099"
            echo "ELECTRON_BUILDER_BINARIES_DOWNLOAD_OVERRIDE_URL=http://127.0.0.1:8099"
          } >> "$GITHUB_ENV"

      # Локальная раздача живёт в пределах шага, поэтому запускается в каждом шаге, где нужна.
      - name: npm ci
        run: |
          node .github/serve-binaries.js "$BINARIES_DIR" 8099 &
          npm ci

      # До electron-builder: он пересобирает better-sqlite3 под Electron, и под Node тесты уже не запустятся.
      - name: Тесты
        run: npx tsx --test src/*.test.ts

      - run: npm run build

      - name: Сборка установщика
        run: |
          node .github/serve-binaries.js "$BINARIES_DIR" 8099 &
          for attempt in 1 2 3; do
            npx electron-builder --win --publish never && exit 0
            echo "::warning::electron-builder упал (попытка $attempt из 3)"
            sleep 20
          done
          exit 1

      - name: Проверка установщика
        run: |
          exe="release/win-unpacked/ICloud Codes.exe"
          app="release/win-unpacked/resources/app"
          test -f release/latest.yml
          test -f "$app/proto/deeplay/mail_code/v1/mail_code.proto"
          # Сервисы в установленном приложении работают на его exe в режиме Node.
          ELECTRON_RUN_AS_NODE=1 "$exe" -e "
            const Database = require('./$app/node_modules/better-sqlite3');
            new Database(':memory:').prepare('select 1').get();
            console.log('better-sqlite3 ok');"
          echo '{"grpc":{"host":"127.0.0.1","port":50099},"imap":{"accounts":[]}}' > "$RUNNER_TEMP/mail-code.json"
          MAIL_CODE_CONFIG="$RUNNER_TEMP/mail-code.json" ELECTRON_RUN_AS_NODE=1 timeout 15 "$exe" "$app/dist/mailCodeMain.js" > grpc.log 2>&1 || true
          cat grpc.log
          grep -q 'MailCodeService' grpc.log

      - name: Релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          release/latest.yml release/icloud-codes-setup-*.exe release/icloud-codes-setup-*.exe.blockmap
          --title "$GITHUB_REF_NAME" --generate-notes
