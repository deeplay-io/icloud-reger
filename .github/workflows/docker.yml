# Образ сервиса кодов для Kubernetes: сборка и проверка запуска.
# На PR и main — только проверка. Из deploy.yml (workflow_call, publish: true) проверенный образ
# публикуется в реестр — тот же, что прошёл проверки, без пересборки.
name: docker

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        description: Опубликовать проверенный образ в реестр
        type: boolean
        default: false
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false
    outputs:
      image:
        description: Опубликованный образ с digest (repo:tag@sha256:…)
        value: ${{ jobs.image.outputs.image }}

permissions:
  contents: read

env:
  IMAGE_REPO: registry.deeplay.io/deeprun-reverse/icloud-codes

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Сборка образа
        run: docker build -t icloud-codes:ci .

      - name: Запуск в режиме снимка
        run: |
          mkdir -p "$RUNNER_TEMP/config"
          echo '{"browser":{"enabled":false},"snapshot":{"port":8080}}' > "$RUNNER_TEMP/config/mail-code.json"
          docker run -d --name codes --read-only -p 8080:8080 -p 50051:50051 \
            -e SNAPSHOT_TOKEN=ci-token-0123456789 -v "$RUNNER_TEMP/config:/config:ro" icloud-codes:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          docker logs codes

      - name: Снимок принимается, токен обязателен
        run: |
          auth='authorization: Bearer ci-token-0123456789'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/status)" = 401
          curl -fsS -H "$auth" http://127.0.0.1:8080/status | grep -q '"version":null'
          curl -fsS -X PUT -H "$auth" -H 'content-type: application/json' \
            -d '{"version":"ci","accounts":[],"aliases":{"a@icloud.com":"p@icloud.com"}}' http://127.0.0.1:8080/snapshot
          curl -fsS -H "$auth" http://127.0.0.1:8080/status | grep -q '"version":"ci"'
          docker logs codes 2>&1 | grep -q 'снимок от приложения получен'

      - name: gRPC отвечает
        run: |
          docker exec codes node -e "
            const grpc = require('@grpc/grpc-js');
            const { mailCodeClient } = require('./dist/grpcServer');
            const Client = mailCodeClient();
            new Client('127.0.0.1:50051', grpc.credentials.createInsecure()).GetCode(
              { email: 'a@icloud.com', kind: 'CODE_KIND_SIGN_UP', wait_seconds: 0 },
              (error, response) => {
                if (error) { console.error(error); process.exit(1); }
                console.log(response);
                // Ящиков в снимке нет: FAIL с подсказкой, а не падение.
                process.exit(response.result === 'GET_CODE_RESULT_FAIL' && /нет ни одного IMAP-пароля/.test(response.error_message) ? 0 : 1);
              });
          "

      - if: always()
        run: docker logs codes || true

      # Публикация — только с тега релиза: тег образа равен git-тегу, неподвижен и однозначно указывает на коммит.
      - name: Публикация в реестр
        id: push
        if: inputs.publish
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] && [[ "$GITHUB_REF_NAME" == v* ]] \
            || { echo "::error::Публикуется только тег v*, а запуск с $GITHUB_REF_TYPE $GITHUB_REF_NAME"; exit 1; }
          want="v$(node -p "require('./package.json').version")"
          [ "$want" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::Тег $GITHUB_REF_NAME, а версия в package.json — $want"; exit 1; }
          echo "$REGISTRY_PASSWORD" | docker login "${IMAGE_REPO%%/*}" -u "$REGISTRY_USERNAME" --password-stdin
          image="$IMAGE_REPO:$GITHUB_REF_NAME"
          docker tag icloud-codes:ci "$image"
          docker push "$image"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image")"
          digest="${digest#*@}"
          echo "image=$image@$digest" >> "$GITHUB_OUTPUT"
          echo "Опубликован \`$image@$digest\`" >> "$GITHUB_STEP_SUMMARY"
